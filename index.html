<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- Primary Meta Tags — Arabic-first fallback since <html lang="ar">.
         useSEO overrides per route once JS boots. -->
    <title>نُمُو — افتح متجرك الإلكتروني في مصر والشرق الأوسط</title>
    <meta
      name="title"
      content="نُمُو — افتح متجرك الإلكتروني في مصر والشرق الأوسط"
    />
    <meta
      name="description"
      content="أول منصة متاجر إلكترونية مصرية ١٠٠٪ — بيموب، فوري، بوسطة، فاتورة إلكترونية، دعم عربي كامل، والدفع عند الاستلام. افتح متجرك في ١٠ دقايق."
    />
    <meta name="author" content="numu Inc." />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="theme-color" content="#F5EFE6" />

    <!-- Geo Tags -->
    <meta name="geo.region" content="EG" />
    <meta name="geo.placename" content="Cairo, Egypt" />
    <meta name="ICBM" content="30.0444, 31.2357" />

    <!-- Canonical (prerender + useSEO will override per route) -->
    <link rel="canonical" href="https://numueg.app/" />

    <!-- Favicon & App Icons — navy-N on cream paper, the brand's canonical
         look. The navy-bg variants ship alongside (/favicon-cream*.png
         inverted) in case a dark-mode-media-query override is needed later.
         See scripts/make-favicons.mjs for the build step. -->
    <link rel="icon" type="image/x-icon" href="/favicon-cream.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-cream-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-cream-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-cream.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-cream.png" />
    <meta name="msapplication-TileColor" content="#F5EFE6" />

    <!-- Preconnect to font origins (must be early) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preconnect for Google Sign-In (saves ~400ms on LCP per Lighthouse) -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />

    <!-- DNS prefetch for Sentry (lazy-loaded) -->
    <link rel="dns-prefetch" href="https://o1234.ingest.sentry.io" />

    <!-- Preload LCP candidate — navbar mark renders as soon as JS boots -->
    <link rel="preload" as="image" href="/numu-mark-cream.webp" fetchpriority="high" />

    <!-- Numu brand kit v1.0 webfonts — Reem Kufi (display, Latin+Arabic),
         Tajawal (Arabic body), Space Grotesk (Latin body), JetBrains Mono
         (labels, metadata). Material Symbols retained for legacy sections
         not yet migrated to lucide. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/index.css" />

    <!-- Inline critical CSS for instant hero render — cream ground matches
         the brand-kit hero, prevents dark→cream flash on JS load. -->
    <style>
      .skeleton-hero {
        min-height: 100vh;
        background: #F5EFE6;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1.5rem;
        padding: 2rem;
      }
      .skeleton-logo {
        width: 120px;
        height: 40px;
        background: rgba(15, 22, 36, 0.06);
        border-radius: 4px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .skeleton-line {
        height: 3rem;
        background: rgba(15, 22, 36, 0.06);
        border-radius: 4px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .skeleton-line-sm {
        height: 1rem;
        background: rgba(15, 22, 36, 0.04);
        border-radius: 4px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
    </style>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NUMU" />
    <meta property="og:url" content="https://numueg.app/" />
    <meta
      property="og:title"
      content="نُمُو — افتح متجرك الإلكتروني في مصر والشرق الأوسط"
    />
    <meta
      property="og:description"
      content="أول منصة متاجر إلكترونية مصرية ١٠٠٪ — بيموب، فوري، بوسطة، فاتورة إلكترونية، ودعم عربي كامل. افتح متجرك في ١٠ دقايق."
    />
    <meta property="og:image" content="https://numueg.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="نُمُو — منصة التجارة الإلكترونية لمصر والشرق الأوسط"
    />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@numueg" />
    <meta name="twitter:creator" content="@numueg" />
    <meta
      name="twitter:title"
      content="نُمُو — افتح متجرك الإلكتروني في مصر والشرق الأوسط"
    />
    <meta
      name="twitter:description"
      content="أول منصة متاجر إلكترونية مصرية ١٠٠٪ — بيموب، فوري، بوسطة، فاتورة إلكترونية، ودعم عربي كامل."
    />
    <meta name="twitter:image" content="https://numueg.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="نُمُو — منصة التجارة الإلكترونية لمصر والشرق الأوسط"
    />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NUMU",
        "alternateName": "نمو",
        "url": "https://numueg.app",
        "logo": "https://numueg.app/numu-mark-cream.webp",
        "description": "أول منصة متاجر إلكترونية مصرية ١٠٠٪ — بيموب، فوري، بوسطة، فاتورة إلكترونية، ودعم عربي كامل.",
        "foundingLocation": {
          "@type": "Place",
          "name": "Cairo, Egypt"
        },
        "areaServed": ["EG", "SA", "AE", "KW", "QA", "BH", "OM"],
        "sameAs": [
          "https://www.instagram.com/numueg_/",
          "https://x.com/numueg",
          "https://www.linkedin.com/in/numueg"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@numueg.app",
          "availableLanguage": ["English", "Arabic"]
        }
      }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "NUMU",
        "alternateName": "نمو",
        "description": "منصة التجارة الإلكترونية لمصر والشرق الأوسط — بيموب، فوري، بوسطة، فاتورة إلكترونية، والدفع عند الاستلام.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": ["en", "ar"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EGP",
          "description": "تجربة مجانية ٣٠ يوم — بدون بطاقة"
        },
        "featureList": [
          "Paymob and Fawry payment gateway integration",
          "Bosta automated shipping and waybill generation",
          "ETA e-invoicing compliance",
          "Native Arabic RTL storefront",
          "Cash on Delivery (COD) management",
          "AI-powered product descriptions in Arabic and English",
          "Multi-channel selling: website, WhatsApp, Instagram, Facebook",
          "Social media product import"
        ],
        "screenshot": "https://numueg.app/og-image.png",
        "url": "https://numueg.app"
      }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NUMU",
        "url": "https://numueg.app",
        "description": "Build and grow your online store in Egypt and MENA with NUMU.",
        "inLanguage": ["en", "ar"],
        "publisher": {
          "@type": "Organization",
          "name": "NUMU",
          "url": "https://numueg.app"
        }
      }
    </script>

    <!-- FAQPage JSON-LD is emitted by components/FAQ.tsx from the same
         items array that renders the visible copy — keeps schema and
         on-page text in lockstep. -->
  </head>
  <body class="bg-background-light text-text-main font-display antialiased">
    <div id="root">
      <!-- Skeleton shown instantly while JS loads — eliminates blank white screen -->
      <div class="skeleton-hero">
        <div class="skeleton-logo"></div>
        <div class="skeleton-line" style="width: 80%; max-width: 600px"></div>
        <div class="skeleton-line" style="width: 60%; max-width: 450px"></div>
        <div
          class="skeleton-line"
          style="width: 70%; max-width: 520px; opacity: 0.7"
        ></div>
        <div style="display: flex; gap: 1rem; margin-top: 1rem">
          <div
            class="skeleton-line-sm"
            style="width: 160px; height: 2.5rem; border-radius: 999px"
          ></div>
          <div
            class="skeleton-line-sm"
            style="width: 140px; height: 2.5rem; border-radius: 999px"
          ></div>
        </div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
