         Lighthouse names the hero <h1> as LCP on both form factors; a
         high-priority image preload here only took bandwidth from the CSS and
         fonts that actually gate first paint. It loads normally with the
         navbar. -->

         (labels, metadata). INLINED, not <link>ed: the cross-origin
         fonts.googleapis.com stylesheet was the most expensive render-blocking
         request on the site (Lighthouse: 442 ms desktop / 861 ms mobile),
         because the .woff2 files could not even be discovered until a separate
         connection had completed a round trip — and the LCP element is the hero
         headline set in this face.

         Regenerate with `node scripts/fetch-font-css.mjs`, which also explains
         why 300/800, Cairo and Material Symbols are gone and why only the
         arabic + latin subsets are kept. -->
