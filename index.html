<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>NUMU — Build Your Online Store in Egypt & MENA</title>
    <meta name="description" content="Launch your e-commerce store with bilingual Arabic-English support, Egyptian payment gateways, Bosta shipping, and ETA e-invoicing. Start selling online today."/>
    <meta name="robots" content="index, follow"/>
    <meta name="theme-color" content="#1e40af"/>
    <link rel="canonical" href="https://numueg.app/"/>
    <link rel="icon" type="image/png" href="/favicon.png"/>

    <!-- Preconnect to font origins (must be early) -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

    <!-- DNS prefetch for Sentry (lazy-loaded) -->
    <link rel="dns-prefetch" href="https://o1234.ingest.sentry.io"/>

    <!-- Preload LCP hero image -->
    <link rel="preload" as="image" href="/numu-logo-en.webp" type="image/webp"/>

    <!-- Critical fonts: Alexandria (hero text) loaded normally with swap -->
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

    <!-- Non-critical fonts: Inter (body) and Material Symbols loaded async -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" media="print" onload="this.media='all'"/>
    <!-- Fallback for browsers with JS disabled -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"/>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"/>
    </noscript>

    <link rel="stylesheet" href="/index.css"/>

    <!-- Open Graph -->
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://numueg.app/"/>
    <meta property="og:title" content="NUMU — Build Your Online Store in Egypt & MENA"/>
    <meta property="og:description" content="Launch your e-commerce store with bilingual Arabic-English support, Egyptian payment gateways, Bosta shipping, and ETA e-invoicing."/>
    <meta property="og:image" content="https://numueg.app/numu-logo-en.webp"/>
    <meta property="og:locale" content="en_US"/>
    <meta property="og:locale:alternate" content="ar_EG"/>

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="NUMU — Build Your Online Store in Egypt & MENA"/>
    <meta name="twitter:description" content="Launch your e-commerce store with bilingual Arabic-English support, Egyptian payment gateways, Bosta shipping, and ETA e-invoicing."/>
    <meta name="twitter:image" content="https://numueg.app/numu-logo-en.webp"/>

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "NUMU",
      "description": "E-commerce platform for Egypt & MENA with bilingual Arabic-English support, Egyptian payments, and shipping integrations.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EGP" }
    }
    </script>
</head>
<body class="bg-background-light text-text-main font-display antialiased">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
