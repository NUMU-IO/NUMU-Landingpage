<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>NUMU Full-Screen Interactive Landing</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1e40af", // Blue-800 as the new primary base
                        "brand-start": "#0f172a",
                        "brand-end": "#1e3a8a",
                        "background-light": "#E0E5EC",
                        "background-alt": "#DDE2E9",
                        "background-dark": "#2a3b4c",
                        "text-main": "#2D3748",
                        "text-muted": "#718096",
                    },
                    backgroundImage: {
                        'brand-gradient': 'linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%)',
                        'brand-gradient-hover': 'linear-gradient(135deg, #1e293b 0%, #1e40af 100%)',
                    },
                    fontFamily: {
                        "display": ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "3xl": "3rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'neu-flat': '9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5)',
                        'neu-flat-sm': '5px 5px 10px rgb(163,177,198,0.6), -5px -5px 10px rgba(255,255,255, 0.5)',
                        'neu-pressed': 'inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8)',
                        'neu-pressed-sm': 'inset 3px 3px 6px 0 rgba(163,177,198, 0.7), inset -3px -3px 6px 0 rgba(255,255,255, 0.8)',
                        'neu-floating': '15px 15px 30px rgb(163,177,198,0.5), -15px -15px 30px rgba(255,255,255, 0.6)',
                        'neu-primary': '5px 5px 10px rgba(15, 23, 42, 0.4), -5px -5px 10px rgba(30, 58, 138, 0.4)',
                        'neu-glow': 'inset 3px 3px 6px 0 rgba(163,177,198, 0.7), inset -3px -3px 6px 0 rgba(255,255,255, 0.8), 0 0 10px rgba(30, 58, 138, 0.3)',
                        'neu-active-glow': 'inset 2px 2px 5px 0 rgba(163,177,198, 0.7), inset -2px -2px 5px 0 rgba(255,255,255, 0.8), 0 0 15px rgba(30, 58, 138, 0.6)',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    },
                    animation: {
                        float: 'float 6s ease-in-out infinite',
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #E0E5EC;
            color: #2D3748;
        }
        .text-gradient {
            background: linear-gradient(135deg, #2D3748 0%, #256af4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-light text-text-main font-display antialiased overflow-hidden">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
