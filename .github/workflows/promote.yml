name: Promote to Production

# Fast-forwards main to dev, which is what actually reaches numueg.app: pushing
# main triggers the Vercel production deploy in deploy.yml.
#
# It used to merge dev into `prod`. Nothing has deployed that branch since May
# 2026 — production moved to Vercel-off-main — so promoting was writing to a
# branch no one reads, and reported success for a release that never shipped.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to promote dev to production"
        required: true
        default: ""

concurrency:
  group: promote-landing
  cancel-in-progress: false

jobs:
  promote:
    name: Promote dev → main
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --ff-only on purpose. A merge commit here would mean dev had diverged
      # from main, and resolving that in CI — unattended, with no way to check
      # the result — is how a release quietly ships something nobody reviewed.
      # If this fails, merge main into dev locally, look at it, and re-run.
      - name: Fast-forward main to dev
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/main origin/dev; then
            git merge --ff-only origin/dev
            git push origin main
          else
            echo "::error::main is not an ancestor of dev — they have diverged."
            echo "Merge main into dev locally, review the result, then re-run this."
            exit 1
          fi

      # Vercel's Git integration is connected to Yahiasherif002/NUMU-Landingpage,
      # not to this repo, and its production branch is `dev`. So the deploy hook
      # below builds THAT repo's `dev` at whatever it currently points to — the
      # promoted commit has to be mirrored there first or the hook cheerfully
      # rebuilds and redeploys yesterday's code while reporting success.
      #
      # This mirror step is what makes the hook mean anything. If the Vercel
      # project is ever repointed at NUMU-IO/NUMU-Landingpage, delete this step
      # and FORK_PUSH_TOKEN with it.
      - name: Mirror the promoted commit to the deploy remote
        env:
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: |
          if [ -z "$FORK_PUSH_TOKEN" ]; then
            echo "::error::Missing repository secret FORK_PUSH_TOKEN."
            echo "Vercel deploys Yahiasherif002/NUMU-Landingpage, so the promoted"
            echo "commit must be pushed there before the deploy hook fires."
            echo "Create a PAT with 'contents: write' on that repo and add it as"
            echo "FORK_PUSH_TOKEN, or repoint the Vercel project at this repo."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          remote="https://x-access-token:$FORK_PUSH_TOKEN@github.com/Yahiasherif002/NUMU-Landingpage.git"
          git push "$remote" "$sha:refs/heads/dev" "$sha:refs/heads/main"
          echo "Mirrored $sha to the deploy remote (dev + main)."

      - name: Trigger the Vercel production deploy
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Missing repository secret VERCEL_DEPLOY_HOOK_URL."
            echo "Vercel → Project Settings → Git → Deploy Hooks; create one on"
            echo "the production branch and store its URL as that secret."
            exit 1
          fi
          response=$(curl --fail --silent --show-error -X POST "$HOOK_URL")
          echo "$response"
          echo "Vercel build triggered."

      # repository_dispatch requires only the existing contents:write fork PAT.
      # The fork builds the mirrored SHA and waits until release.json proves that
      # the asynchronous Vercel build published that exact commit.
      - name: Trigger the fork production workflow
        env:
          GH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api --method POST \
            repos/Yahiasherif002/NUMU-Landingpage/dispatches \
            -f event_type=promote-production \
            -f "client_payload[sha]=$sha"
          echo "Fork deploy.yml dispatched for $sha."

      - name: Summary
        run: |
          {
            echo "### Promoted dev → main"
            echo ""
            echo "Commit: \`$(git rev-parse --short HEAD)\`"
            echo ""
            echo "Mirrored to the deploy remote, triggered Vercel, and dispatched verification."
            echo "Watch it at <https://github.com/Yahiasherif002/NUMU-Landingpage/actions/workflows/deploy.yml>."
          } >> "$GITHUB_STEP_SUMMARY"
