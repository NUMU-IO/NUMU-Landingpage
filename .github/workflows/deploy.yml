name: Deploy Landing Page

# Vercel is connected to Yahiasherif002/NUMU-Landingpage. The upstream
# promotion mirrors the release there, fires the Vercel deploy hook, then sends
# a repository_dispatch event to this workflow. This job independently builds
# the same commit and does not need Vercel credentials in the fork.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [promote-production]

concurrency:
  group: deploy-landing-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Build & verify production
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event.client_payload.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and verify all prerendered routes
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run build:ssg

      # The deploy hook runs asynchronously. release.json is written by the
      # production build from VERCEL_GIT_COMMIT_SHA, so matching it proves the
      # exact promoted commit—not merely a similar bundle—reached production.
      - name: Wait for the promoted commit
        run: |
          for attempt in {1..60}; do
            release=$(curl -fsSL --retry 2 --retry-delay 2 \
              "https://numueg.app/release.json?sha=$EXPECTED_SHA" 2>/dev/null || true)
            if echo "$release" | grep -q "$EXPECTED_SHA"; then
              echo "Production is serving $EXPECTED_SHA."
              exit 0
            fi
            echo "Attempt $attempt/60: production has not reached $EXPECTED_SHA yet."
            sleep 10
          done
          echo "::error::Production did not publish $EXPECTED_SHA within 10 minutes."
          exit 1

      - name: Verify localized search facts
        run: |
          pricing=$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors https://numueg.app/en/pricing)
          facts=$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors https://numueg.app/en/about/facts)
          sitemap=$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors https://numueg.app/sitemap.xml)
          echo "$pricing" | grep -qi 'canonical" href="https://numueg.app/en/pricing' \
            || { echo "::error::English pricing canonical is missing"; exit 1; }
          echo "$pricing" | grep -qi '37-day' \
            || { echo "::error::37-day trial is missing from English pricing"; exit 1; }
          echo "$facts" | grep -qi 'unlimited orders' \
            || { echo "::error::Official facts do not state unlimited orders"; exit 1; }
          echo "$sitemap" | grep -q '<loc>https://numueg.app/ar/learn/open-store-egypt</loc>' \
            || { echo "::error::Localized academy URLs are missing from sitemap"; exit 1; }
          echo "$sitemap" | grep -q '<loc>https://numueg.app/en/integrations/paymob</loc>' \
            || { echo "::error::Localized integration URLs are missing from sitemap"; exit 1; }
          echo "Localized canonicals, facts, and sitemap are live."

      - name: Summary
        run: |
          {
            echo "### Landing page deployment verified"
            echo ""
            echo "- **Commit:** \`${EXPECTED_SHA:0:7}\`"
            echo "- **Live at:** https://numueg.app"
            echo "- **Coverage:** 112 localized prerendered routes"
          } >> "$GITHUB_STEP_SUMMARY"
