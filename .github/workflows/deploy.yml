name: Deploy Landing Page

# numueg.app is served by Vercel (Cloudflare sits in front of it). This workflow
# is the deploy path: push to main ships production, push to dev ships a preview
# URL, and either can be re-run by hand from the Actions tab.
#
# It replaces an rsync deploy to 188.166.156.151 — the DigitalOcean droplet that
# was decommissioned. That host stopped answering, so every run of this workflow
# since June 2026 failed, while the site it was supposed to be deploying carried
# on being served from somewhere else entirely.
#
# ─── Required secrets ────────────────────────────────────────────────────────
#   VERCEL_TOKEN        Account Settings → Tokens
#   VERCEL_ORG_ID       Project Settings → General ("Team ID" / "Vercel ID")
#   VERCEL_PROJECT_ID   Project Settings → General ("Project ID")
#
# Without VERCEL_TOKEN the job stops at the preflight step with an explanation
# rather than failing several minutes later inside the Vercel CLI.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Build & deploy (${{ github.ref_name == 'main' && 'production' || 'preview' }})
    runs-on: ubuntu-latest

    # The Vercel CLI reads all three of these from the environment, so no step
    # has to pass --token and no secret is ever interpolated into a shell line.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      # Secrets are read through the environment, never interpolated into the
      # script body — an expression expands before the shell parses the line,
      # so a secret containing shell syntax would be executed rather than read.
      - name: Preflight — credentials present?
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ]      || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ]     || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_PROJECT_ID)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "VERCEL_TOKEN comes from Vercel → Account Settings → Tokens;"
            echo "the two IDs from the project's Settings → General."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Resolve production vs preview once, so no later step has to repeat the
      # branch test and none of them can disagree about which one this is.
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod"    >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag="       >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project settings
        run: npx --yes vercel@latest pull --yes --environment=${{ steps.target.outputs.env }}

      # Built here rather than on Vercel's build container, and deployed with
      # --prebuilt. The prerender step needs a real Chrome: this runner has one
      # preinstalled, whereas the build container has none and has to unpack
      # @sparticuz/chromium to stand one up. Building here also means a broken
      # build fails in this log, where it is visible, instead of silently
      # leaving the previous deployment live.
      - name: Build (vite + prerender + prerender gate)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx --yes vercel@latest build ${{ steps.target.outputs.flag }}

      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt ${{ steps.target.outputs.flag }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # Proves the deployment serves what was just built, rather than trusting
      # that a green deploy step means a changed site — the two came apart here
      # before, which is how an eight-week-old build stayed live unnoticed.
      # The deployment URL is checked, not numueg.app: the alias and the CDN in
      # front of it can lag, and a stale cached copy is not a failed deploy.
      - name: Verify the deployment serves this build
        run: |
          built=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          echo "Expecting bundle: $built"
          body=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/")
          echo "$body" | grep -q "$built" \
            || { echo "::error::Deployment does not reference $built"; exit 1; }
          echo "$body" | grep -q 'x-numu-prerendered' \
            || { echo "::error::Deployment served a raw SPA shell — prerender did not survive"; exit 1; }
          echo "OK — $built is live at ${{ steps.deploy.outputs.url }}"

      - name: Summary
        run: |
          {
            echo "### Landing page deployed"
            echo ""
            echo "- **Target:** ${{ steps.target.outputs.env }}"
            echo "- **Branch:** \`${{ github.ref_name }}\` @ \`${GITHUB_SHA:0:7}\`"
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
            if [ "${{ steps.target.outputs.env }}" = "production" ]; then
              echo "- **Live at:** https://numueg.app"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
