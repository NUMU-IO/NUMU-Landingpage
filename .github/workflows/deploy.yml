name: Deploy Landing Page

on:
  push:
    branches: [dev, stage, prod]

concurrency:
  group: deploy-landing-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  DEPLOY_HOST: 188.166.156.151
  DEPLOY_USER: root

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Map the source branch → per-env deploy path + outbound URLs.
      # Each env gets its own /opt/numu/landing-page{,-test,-stage}
      # directory served by nginx; the nginx test/staging server blocks
      # root from those dirs (see NUMU-api/docker/nginx/nginx.conf).
      - name: Resolve deploy target for ${{ github.ref_name }}
        id: target
        run: |
          case "${{ github.ref_name }}" in
            dev)
              echo "remote_path=/opt/numu/landing-page-test/" >> "$GITHUB_OUTPUT"
              echo "dashboard_url=https://merchant-test.numueg.app" >> "$GITHUB_OUTPUT"
              ;;
            stage)
              echo "remote_path=/opt/numu/landing-page-stage/" >> "$GITHUB_OUTPUT"
              echo "dashboard_url=https://merchant-staging.numueg.app" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "remote_path=/opt/numu/landing-page/" >> "$GITHUB_OUTPUT"
              echo "dashboard_url=https://merchant.numueg.app" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported branch ${{ github.ref_name }}"
              exit 1
              ;;
          esac

      # Chrome is preinstalled on ubuntu-latest runners at /usr/bin/google-chrome.
      # The prerender script picks it up via the CHROME_PATH env var.
      - name: Build + prerender (SSG)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          VITE_DASHBOARD_URL: ${{ steps.target.outputs.dashboard_url }}
        run: npm run build:ssg

      - name: Verify prerender produced per-route HTML
        run: |
          set -e
          for route in "" pricing contact privacy terms refund data-deletion 404; do
            file="dist/${route}/index.html"
            [ "$route" = "" ] && file="dist/index.html"
            if [ ! -f "$file" ]; then
              echo "::error::Missing prerendered file: $file"
              exit 1
            fi
            if ! grep -q "x-numu-prerendered" "$file"; then
              echo "::error::$file is not a prerendered document (missing marker)"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: ${{ steps.target.outputs.remote_path }}
          remote_host: ${{ env.DEPLOY_HOST }}
          remote_user: ${{ env.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker exec numu-nginx-staging nginx -s reload
            echo "Landing page deployed (branch=${{ github.ref_name }}) → ${{ steps.target.outputs.remote_path }}"
